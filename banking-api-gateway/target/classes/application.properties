spring.application.name=banking-api-gateway
server.port=9091
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Static routes for this first working demo. Eureka registration is enabled,
# but routing is deliberately kept explicit to make local debugging easier.
spring.cloud.gateway.server.webmvc.routes[0].id=account-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/transactions/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=health,info
